# Curated, hand-written additions for the configuration reference page.
#
# Everything about a setting that can come from code (type, default, aliases,
# environment variables, description) is generated by ``conda_config_reference``
# and must NOT be repeated here. Keys are setting names from
# ``Context.category_map``; an unknown name is reported as a build warning.
#
# Supported keys per setting:
#   summary:     one-line summary for the overview table (default: first
#                sentence of the description)
#   example:     YAML shown in a code block (``.condarc`` syntax)
#   notes:       extra Markdown shown after the description and example
#   added_in:    "VERSION [note]" or a list of them (``versionadded``)
#   changed_in:  "VERSION [note]" or a list of them (``versionchanged``)
#   deprecated:  "VERSION [note]" (``deprecated``); sorts the setting last
#   seealso:     RST put in a ``seealso`` admonition
#   labels:      legacy RST labels that should resolve to this entry

channels:
  example: |
    channels:
      - <anaconda_dot_org_username>
      - http://some.custom/channel
      - file:///some/local/directory
      - defaults
  notes: |
    Use `defaults` to include all default channels. Non-URL channels are
    interpreted as Anaconda.org user or organization names; change this with
    `channel_alias`.
  seealso: :doc:`/user-guide/configuration/settings`

channel_settings:
  added_in:
    - 23.3.0
    - 26.9.0 Support for channel-specific ``exclude_newer`` settings.

allowlist_channels:
  added_in: 24.9.0

denylist_channels:
  added_in: 24.9.0 Complements ``allowlist_channels``.

ssl_verify:
  example: |
    ssl_verify: truststore
  changed_in: 23.9.0 The ``truststore`` value is only available in this version or later.

console:
  added_in: 24.11.0

exclude_newer:
  added_in: 26.9.0
  example: |
    exclude_newer: 7d
  seealso: :ref:`installing-packages-with-an-upload-cutoff`

exclude_newer_package:
  added_in: 26.9.0

repodata_use_shards:
  added_in: 26.5.0
  example: |
    repodata_use_shards: false

experimental:
  deprecated: 27.3 Scheduled for removal in 27.9.

report_errors:
  deprecated: 26.9 Scheduled for removal in 27.3.
